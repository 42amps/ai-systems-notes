<svg width="1200" height="600" viewBox="0 0 1200 600" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">RAG evaluation loop</title>
  <desc id="desc">A RAG evaluation loop from documents and queries through retrieval, generation, judging, failure analysis, and system changes.</desc>
  <rect width="1200" height="600" fill="#F8FAFC"/>
  <rect x="46" y="46" width="1108" height="508" rx="28" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="2"/>
  <text x="84" y="106" fill="#0F172A" font-family="Inter, Arial, sans-serif" font-size="34" font-weight="800">RAG evaluation loop</text>
  <text x="84" y="140" fill="#475569" font-family="Inter, Arial, sans-serif" font-size="18">Separate retrieval quality from answer quality, then use failures to decide the next system change.</text>

  <g font-family="Inter, Arial, sans-serif">
    <rect x="92" y="240" width="160" height="84" rx="16" fill="#EFF6FF" stroke="#60A5FA" stroke-width="2"/>
    <text x="122" y="274" fill="#1E3A8A" font-size="18" font-weight="800">Documents</text>
    <text x="122" y="300" fill="#1E40AF" font-size="14">Pages, chunks, metadata</text>

    <rect x="322" y="240" width="160" height="84" rx="16" fill="#F0FDFA" stroke="#2DD4BF" stroke-width="2"/>
    <text x="352" y="274" fill="#115E59" font-size="18" font-weight="800">Queries</text>
    <text x="352" y="300" fill="#0F766E" font-size="14">Expected evidence</text>

    <rect x="552" y="200" width="180" height="84" rx="16" fill="#F8FAFC" stroke="#94A3B8" stroke-width="2"/>
    <text x="582" y="234" fill="#0F172A" font-size="18" font-weight="800">Retrieve</text>
    <text x="582" y="260" fill="#475569" font-size="14">Recall@k, MRR</text>

    <rect x="552" y="330" width="180" height="84" rx="16" fill="#F8FAFC" stroke="#94A3B8" stroke-width="2"/>
    <text x="582" y="364" fill="#0F172A" font-size="18" font-weight="800">Generate</text>
    <text x="582" y="390" fill="#475569" font-size="14">Faithfulness, latency</text>

    <rect x="812" y="240" width="180" height="84" rx="16" fill="#FFF7ED" stroke="#FB923C" stroke-width="2"/>
    <text x="842" y="274" fill="#7C2D12" font-size="18" font-weight="800">Judge</text>
    <text x="842" y="300" fill="#9A3412" font-size="14">Groundedness + review</text>

    <rect x="812" y="390" width="180" height="84" rx="16" fill="#FEF2F2" stroke="#F87171" stroke-width="2"/>
    <text x="842" y="424" fill="#7F1D1D" font-size="18" font-weight="800">Failure analysis</text>
    <text x="842" y="450" fill="#991B1B" font-size="14">Missed retrieval or bad synthesis</text>
  </g>

  <g stroke="#334155" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
    <path d="M252 282H322"/>
    <path d="M482 282C518 282 520 242 552 242"/>
    <path d="M732 242C768 242 776 282 812 282"/>
    <path d="M732 372C768 372 776 282 812 282"/>
    <path d="M902 324V390"/>
    <path d="M812 432C620 520 260 500 172 324"/>
  </g>
  <g fill="#334155">
    <path d="M322 282L310 275V289L322 282Z"/>
    <path d="M552 242L540 235V249L552 242Z"/>
    <path d="M812 282L800 275V289L812 282Z"/>
    <path d="M902 390L895 378H909L902 390Z"/>
    <path d="M172 324L172 338L160 330L172 324Z"/>
  </g>
</svg>
