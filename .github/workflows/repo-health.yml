name: Repo Health

on:
  pull_request:
  schedule:
    - cron: "30 5 * * 0"
  workflow_dispatch:

jobs:
  markdown:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Check Markdown links
        uses: lycheeverse/lychee-action@v2
        with:
          args: --verbose --no-progress './**/*.md'
          fail: true
